<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Send an enquiry to Mahlodi Bakehouse about products or custom orders.">
  <title>Mahlodi Bakehouse | Enquiry</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Mahlodi Bakehouse</h1>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="products.html">Products</a>
      <a href="enquiry.html" aria-current="page">Enquiry</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Make an Enquiry</h2>
      <p>Tell us what you need and we will get back to you.</p>

      <form action="#" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone number</label>
        <input type="tel" id="phone" name="phone">

        <label for="type">Enquiry type</label>
        <select id="type" name="type" required>
          <option value="">Select an option</option>
          <option value="bread">Bread</option>
          <option value="pastries">Pastries</option>
          <option value="cakes">Cakes</option>
          <option value="custom">Custom order</option>
          <option value="other">Other</option>
        </select>

        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit">Send Enquiry</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Mahlodi Bakehouse. Academic project.</p>
  </footer>

</body>
</html>
